name: Deploy to Liara

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Liara
        uses: liara-ir/github-actions@v2
        with:
          app_name: shydashykhy
          token: ${{ secrets.LIARA_API_TOKEN }}